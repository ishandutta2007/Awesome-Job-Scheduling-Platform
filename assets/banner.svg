<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #F8FAFC;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38BDF8;
    }
    
    /* Dynamic Animated Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotateClock {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashMove 2s linear infinite;
    }
    .node-group {
      animation: floatNode 4s ease-in-out infinite;
    }
    .node-group-delayed {
      animation: floatNode 4s ease-in-out infinite 2s;
    }
    .clock-hand {
      animation: rotateClock 12s linear infinite;
      transform-origin: 1050px 160px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="320" fill="url(#grid)" />
  </g>

  <!-- Dynamic Animated Ambient Light Blobs (Background) -->
  <circle class="pulse-bg" cx="150" cy="100" r="140" fill="#38BDF8" opacity="0.15" filter="url(#glow)" />
  <circle class="pulse-bg" cx="1050" cy="220" r="160" fill="#818CF8" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic DAG Workflow Representation (Background/Sides) -->
  <g stroke-linecap="round">
    <!-- Flow connection lines -->
    <path d="M 900 120 L 980 160 L 1060 110" fill="none" stroke="#6366F1" stroke-width="2" class="flow-line" />
    <path d="M 980 160 L 1070 210" fill="none" stroke="#38BDF8" stroke-width="2" class="flow-line" />
    <path d="M 120 220 L 200 170 L 280 230" fill="none" stroke="#818CF8" stroke-width="2" class="flow-line" />
  </g>

  <!-- Animated DAG Nodes -->
  <g class="node-group">
    <circle cx="900" cy="120" r="10" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="1060" cy="110" r="12" fill="#10B981" filter="url(#glow)" />
  </g>
  <g class="node-group-delayed">
    <circle cx="980" cy="160" r="14" fill="#818CF8" filter="url(#glow)" />
    <circle cx="1070" cy="210" r="10" fill="#F59E0B" filter="url(#glow)" />
    <circle cx="200" cy="170" r="11" fill="#38BDF8" filter="url(#glow)" />
  </g>

  <!-- Animated Cron / Scheduler Clock Visual Element -->
  <g transform="translate(0, 0)">
    <circle cx="1050" cy="160" r="45" fill="#1E293B" stroke="#475569" stroke-width="3" opacity="0.9" />
    <circle cx="1050" cy="160" r="3" fill="#F8FAFC" />
    <!-- Clock Hands -->
    <line class="clock-hand" x1="1050" y1="160" x2="1050" y2="130" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="1050" y1="160" x2="1070" y2="160" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, and Pill Badges (Always clear & unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="250" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="14" r="5" fill="#10B981" />
      <text x="30" y="19" class="badge-text">PRODUCTION WORKLOAD SPEC</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="128" class="title">Awesome Job Scheduling Platforms</text>

    <!-- Colorful Accent Bar under Title -->
    <rect x="0" y="145" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">Enterprise Workload Automation, SaaS Cron Observability &amp; Open-Source DAG Orchestrators</text>

    <!-- Sub-features Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1E293B" opacity="0.8" />
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#CBD5E1">⚡ Batch Scheduling</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="150" height="26" rx="6" fill="#1E293B" opacity="0.8" />
      <text x="154" y="17" font-family="sans-serif" font-size="12" fill="#CBD5E1">🔗 Workflow DAGs</text>

      <!-- Tag 3 -->
      <rect x="304" y="0" width="140" height="26" rx="6" fill="#1E293B" opacity="0.8" />
      <text x="316" y="17" font-family="sans-serif" font-size="12" fill="#CBD5E1">📡 Cron Monitoring</text>
    </g>
  </g>
</svg>
